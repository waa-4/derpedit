<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Derpedit v0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#0d1118;color:#eef7ff}button,input,select{font:inherit}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#121925;border-bottom:1px solid #334158;gap:10px}.brand b{color:#24d9ff;font-size:22px}.brand span{color:#8fa2ba;font-size:12px;margin-left:8px}.tools{display:flex;gap:6px;overflow:auto}.tools button,.fake{border:1px solid #36455e;background:#202a39;color:white;padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}.tools .play{border-color:#20dcff;background:#0d7188;font-weight:800}.fake input{display:none}.app{height:calc(100% - 58px);display:grid;grid-template-columns:210px 1fr 250px}.panel{background:#171e2a;padding:12px;overflow:auto}.left{border-right:1px solid #334158}.right{border-left:1px solid #334158}h2{font-size:13px;letter-spacing:1px;color:#b6c6d9;margin:5px 0 9px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}.palette button,.scene button{border:1px solid #36455e;background:#202a39;color:white;padding:10px 6px;border-radius:7px;cursor:pointer}.scene{display:flex;flex-direction:column;gap:5px}.scene button{text-align:left}.scene button.sel{border-color:#21d9ff;background:#123846}.workspaceWrap{display:flex;flex-direction:column;min-width:0}.bar{height:38px;background:#151c27;border-bottom:1px solid #334158;padding:0 10px;display:flex;align-items:center;gap:12px;color:#93a4ba;font-size:12px}.bar strong{color:#22d9ff}.workspace{position:relative;flex:1;overflow:hidden;background:#202633}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:24px 24px;pointer-events:none}.obj{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;cursor:move;border:1px solid #ffffff40;overflow:hidden;font-size:12px}.obj.player,.obj.enemy,.obj.coin{border-radius:50%}.obj.spawn{background:transparent!important;border:2px dashed #61efff;color:#61efff}.obj.text{background:transparent!important;border-style:dashed}.obj.sel{outline:3px solid #22d9ff;outline-offset:2px;box-shadow:0 0 15px #22d9ff55}.props{display:flex;flex-direction:column;gap:8px}.props label,.stack{font-size:12px;color:#b7c6d8;display:flex;flex-direction:column;gap:4px}.props input,.props select,.stack input,.stack select{background:#0e141d;color:white;border:1px solid #36455e;border-radius:6px;padding:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.muted{color:#91a2b9;font-size:12px;line-height:1.4}.hidden{display:none!important}.playLayer{position:absolute;inset:0;background:#000;z-index:10}.playLayer canvas{width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;left:10px;right:10px;top:10px;display:flex;justify-content:space-between}.hud span,.hud button{background:#000a;color:white;border:1px solid #ffffff55;border-radius:7px;padding:8px 10px}
</style></head><body>
<header class='top'><div class='brand'><b>DERPEDIT</b><span>v0.1 — The First Brick</span></div><div class='tools'><button id='new'>New</button><button id='save'>Save Project</button><label class='fake'>Load Project<input id='load' type='file' accept='.derpedit,.json'></label><button id='undo'>Undo</button><button id='redo'>Redo</button><button class='play' id='play'>▶ Play</button><button id='export'>Export Game HTML</button></div></header>
<div class='app'>
<aside class='panel left'><h2>OBJECTS</h2><div class='palette'><button data-add='player'>🟦 Player</button><button data-add='enemy'>🟥 Enemy</button><button data-add='wall'>⬜ Wall</button><button data-add='coin'>🟨 Coin</button><button data-add='text'>T Text</button><button data-add='spawn'>✦ Spawn</button></div><h2>SCENE</h2><div id='scene' class='scene'></div><p class='muted'>Select and drag objects. Press Delete to remove one.</p></aside>
<section class='workspaceWrap'><div class='bar'><strong id='mode'>BUILD MODE</strong><label><input id='snap' type='checkbox' checked> Grid snap</label><span id='status'>Ready.</span></div><div class='workspace' id='workspace'><div class='grid' id='grid'></div><div id='layer'></div><div class='playLayer hidden' id='playLayer'><div class='hud'><span id='score'>Coins: 0/0</span><button id='stop'>■ Stop</button></div><canvas id='canvas'></canvas></div></div></section>
<aside class='panel right'><h2>PROPERTIES</h2><div id='none' class='muted'>Select an object to edit it.</div><div id='props' class='props hidden'><label>Name<input id='name'></label><div class='two'><label>X<input id='x' type='number'></label><label>Y<input id='y' type='number'></label></div><div class='two'><label>Width<input id='w' type='number' min='8'></label><label>Height<input id='h' type='number' min='8'></label></div><label>Rotation<input id='rot' type='number'></label><label>Color<input id='color' type='color'></label><label>Speed<input id='speed' type='number'></label><label>Behavior<select id='behavior'><option value='none'>None</option><option value='player'>Player controls</option><option value='chase'>Chase player</option><option value='solid'>Solid wall</option><option value='coin'>Collectible</option><option value='spawn'>Spawn marker</option></select></label><label id='textWrap'>Text<input id='text'></label><button id='dup'>Duplicate</button><button id='del'>Delete</button></div><h2>PROJECT</h2><label class='stack'>Name<input id='projectName' value='My Derpedit Game'></label><label class='stack'>Background<input id='bg' type='color' value='#202633'></label></aside>
</div>
<script>
const $=id=>document.getElementById(id), layer=$('layer'), workspace=$('workspace');
const defs={player:{w:44,h:44,color:'#278cff',speed:240,behavior:'player',name:'Player'},enemy:{w:42,h:42,color:'#e3424f',speed:100,behavior:'chase',name:'Enemy'},wall:{w:120,h:36,color:'#d8dee9',speed:0,behavior:'solid',name:'Wall'},coin:{w:28,h:28,color:'#ffd33d',speed:0,behavior:'coin',name:'Coin'},text:{w:150,h:36,color:'#ffffff',speed:0,behavior:'none',name:'Text',text:'Hello, Derpedit!'},spawn:{w:46,h:46,color:'#61efff',speed:0,behavior:'spawn',name:'Spawn'}};
let p={version:'0.1',name:'My Derpedit Game',background:'#202633',objects:[]},sel=null,hist=[],future=[],drag=null,game=null;
const clone=v=>JSON.parse(JSON.stringify(v)), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36), snap=v=>$('snap').checked?Math.round(v/24)*24:Math.round(v), selected=()=>p.objects.find(o=>o.id===sel);
function checkpoint(){hist.push(JSON.stringify(p));if(hist.length>50)hist.shift();future=[];buttons()}
function buttons(){$('undo').disabled=!hist.length;$('redo').disabled=!future.length}
function add(type){checkpoint();const d=defs[type],n=p.objects.filter(o=>o.type===type).length+1,o={id:uid(),type,name:d.name+(n>1?' '+n:''),x:snap(100+n*20),y:snap(80+n*20),w:d.w,h:d.h,rotation:0,color:d.color,speed:d.speed,behavior:d.behavior,text:d.text||''};p.objects.push(o);sel=o.id;render()}
function render(){p.name=$('projectName').value||p.name;p.background=$('bg').value;workspace.style.background=p.background;layer.innerHTML='';for(const o of p.objects){const e=document.createElement('div');e.className='obj '+o.type+(o.id===sel?' sel':'');e.dataset.id=o.id;e.style.cssText=`left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;background:${o.color};transform:rotate(${o.rotation}deg);`;e.textContent=o.type==='text'?(o.text||o.name):o.type==='spawn'?'SPAWN':o.name;e.onpointerdown=startDrag;e.onclick=ev=>{ev.stopPropagation();sel=o.id;render()};layer.appendChild(e)}renderScene();renderProps()}
function renderScene(){const s=$('scene');s.innerHTML='';for(const o of p.objects){const b=document.createElement('button');b.textContent=o.type.toUpperCase()+' — '+o.name;b.className=o.id===sel?'sel':'';b.onclick=()=>{sel=o.id;render()};s.appendChild(b)}if(!p.objects.length)s.innerHTML='<div class="muted">No objects yet.</div>'}
function renderProps(){const o=selected();$('none').classList.toggle('hidden',!!o);$('props').classList.toggle('hidden',!o);if(!o)return;for(const [id,key] of [['name','name'],['x','x'],['y','y'],['w','w'],['h','h'],['rot','rotation'],['color','color'],['speed','speed'],['behavior','behavior'],['text','text']])$(id).value=o[key]??'';$('textWrap').classList.toggle('hidden',o.type!=='text')}
function bind(id,key,num=false){$(id).onchange=()=>{const o=selected();if(!o)return;checkpoint();o[key]=num?Number($(id).value):$(id).value;render()}}
[['name','name'],['x','x',1],['y','y',1],['w','w',1],['h','h',1],['rot','rotation',1],['color','color'],['speed','speed',1],['behavior','behavior'],['text','text']].forEach(a=>bind(...a));
function startDrag(e){e.stopPropagation();const o=p.objects.find(q=>q.id===e.currentTarget.dataset.id);if(!o)return;sel=o.id;checkpoint();drag={id:o.id,sx:e.clientX,sy:e.clientY,x:o.x,y:o.y};e.currentTarget.setPointerCapture(e.pointerId);renderScene();renderProps()}
addEventListener('pointermove',e=>{if(!drag)return;const o=p.objects.find(q=>q.id===drag.id);o.x=snap(drag.x+e.clientX-drag.sx);o.y=snap(drag.y+e.clientY-drag.sy);const el=layer.querySelector(`[data-id="${o.id}"]`);if(el){el.style.left=o.x+'px';el.style.top=o.y+'px'}$('x').value=o.x;$('y').value=o.y});addEventListener('pointerup',()=>drag=null);workspace.onclick=()=>{if(!game){sel=null;render()}};
function del(){if(!selected())return;checkpoint();p.objects=p.objects.filter(o=>o.id!==sel);sel=null;render()}function dup(){const o=selected();if(!o)return;checkpoint();const c=clone(o);c.id=uid();c.name+=' Copy';c.x+=24;c.y+=24;p.objects.push(c);sel=c.id;render()}
$('del').onclick=del;$('dup').onclick=dup;addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='Delete')del()});
$('undo').onclick=()=>{if(!hist.length)return;future.push(JSON.stringify(p));p=JSON.parse(hist.pop());sel=null;sync();render();buttons()};$('redo').onclick=()=>{if(!future.length)return;hist.push(JSON.stringify(p));p=JSON.parse(future.pop());sel=null;sync();render();buttons()};
function sync(){$('projectName').value=p.name||'My Derpedit Game';$('bg').value=p.background||'#202633'}
$('save').onclick=()=>download((p.name||'Project').replace(/\W+/g,'-')+'.derpedit',JSON.stringify(p,null,2),'application/json');$('load').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{checkpoint();p=JSON.parse(r.result);sel=null;sync();render()}catch{alert('Could not load that project.')}};r.readAsText(f)};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('new').onclick=()=>{if(confirm('Start a new project?')){checkpoint();p={version:'0.1',name:'My Derpedit Game',background:'#202633',objects:[]};sel=null;sync();render()}};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function move(o,dx,dy,obs){o.x+=dx;for(const s of obs)if(hit(o,s))o.x=dx>0?s.x-o.w:s.x+s.w;o.y+=dy;for(const s of obs)if(hit(o,s))o.y=dy>0?s.y-o.h:s.y+s.h}
$('play').onclick=()=>{if(game)return;$('playLayer').classList.remove('hidden');$('mode').textContent='PLAY MODE';const c=$('canvas'),ctx=c.getContext('2d'),r=workspace.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);const O=clone(p.objects),sp=O.find(o=>o.behavior==='spawn');let pl=O.find(o=>o.behavior==='player')||{id:'p',type:'player',x:50,y:50,w:42,h:42,color:'#278cff',speed:220,behavior:'player'};if(!O.includes(pl))O.push(pl);if(sp){pl.x=sp.x;pl.y=sp.y}game={ctx,w:r.width,h:r.height,O,pl,keys:{},got:0,total:O.filter(o=>o.behavior==='coin').length,last:performance.now()};requestAnimationFrame(loop)};
function kd(e){if(game)game.keys[e.key.toLowerCase()]=1}function ku(e){if(game)game.keys[e.key.toLowerCase()]=0}addEventListener('keydown',kd);addEventListener('keyup',ku);
function loop(t){if(!game)return;const g=game,dt=Math.min(.033,(t-g.last)/1000);g.last=t;let dx=(g.keys.d||g.keys.arrowright?1:0)-(g.keys.a||g.keys.arrowleft?1:0),dy=(g.keys.s||g.keys.arrowdown?1:0)-(g.keys.w||g.keys.arrowup?1:0),l=Math.hypot(dx,dy)||1,solid=g.O.filter(o=>o.behavior==='solid');move(g.pl,dx/l*g.pl.speed*dt,dy/l*g.pl.speed*dt,solid);g.pl.x=Math.max(0,Math.min(g.w-g.pl.w,g.pl.x));g.pl.y=Math.max(0,Math.min(g.h-g.pl.h,g.pl.y));for(const e of g.O.filter(o=>o.behavior==='chase')){let vx=g.pl.x-e.x,vy=g.pl.y-e.y,z=Math.hypot(vx,vy)||1;move(e,vx/z*e.speed*dt,vy/z*e.speed*dt,solid)}for(const q of g.O.filter(o=>o.behavior==='coin'&&!o.collected))if(hit(g.pl,q)){q.collected=1;g.got++}$('score').textContent=`Coins: ${g.got}/${g.total}`;g.ctx.fillStyle=p.background;g.ctx.fillRect(0,0,g.w,g.h);for(const o of g.O){if(o.behavior==='spawn'||o.collected)continue;g.ctx.save();g.ctx.translate(o.x+o.w/2,o.y+o.h/2);g.ctx.rotate((o.rotation||0)*Math.PI/180);g.ctx.fillStyle=o.color;if(['player','enemy','coin'].includes(o.type)){g.ctx.beginPath();g.ctx.ellipse(0,0,o.w/2,o.h/2,0,0,7);g.ctx.fill()}else if(o.type==='text'){g.ctx.font='20px system-ui';g.ctx.textAlign='center';g.ctx.fillText(o.text||o.name,0,5)}else g.ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);g.ctx.restore()}if(g.total&&g.got>=g.total){g.ctx.fillStyle='#000a';g.ctx.fillRect(0,0,g.w,g.h);g.ctx.fillStyle='white';g.ctx.textAlign='center';g.ctx.font='bold 42px system-ui';g.ctx.fillText('YOU WIN!',g.w/2,g.h/2)}requestAnimationFrame(loop)}
$('stop').onclick=()=>{game=null;$('playLayer').classList.add('hidden');$('mode').textContent='BUILD MODE'};
function exported(){const data=JSON.stringify(p).replace(/</g,'\\u003c');return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${p.name}</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}.h{position:fixed;left:10px;top:10px;color:white;background:#000a;padding:8px;font-family:system-ui;border-radius:7px}</style></head><body><canvas id="c"></canvas><div class="h" id="h"></div><script>const P=${data};const c=document.getElementById('c'),x=c.getContext('2d'),h=document.getElementById('h');let W,H,D,O=JSON.parse(JSON.stringify(P.objects)),K={},got=0,total=O.filter(o=>o.behavior==='coin').length,sp=O.find(o=>o.behavior==='spawn'),pl=O.find(o=>o.behavior==='player')||{type:'player',x:40,y:40,w:42,h:42,color:'#278cff',speed:220,behavior:'player'};if(!O.includes(pl))O.push(pl);if(sp){pl.x=sp.x;pl.y=sp.y}onresize=()=>{D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)};onresize();onkeydown=e=>K[e.key.toLowerCase()]=1;onkeyup=e=>K[e.key.toLowerCase()]=0;const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;function mv(o,dx,dy){const s=O.filter(q=>q.behavior==='solid');o.x+=dx;for(const z of s)if(hit(o,z))o.x=dx>0?z.x-o.w:z.x+z.w;o.y+=dy;for(const z of s)if(hit(o,z))o.y=dy>0?z.y-o.h:z.y+z.h}let last=performance.now();function L(t){let dt=Math.min(.033,(t-last)/1000);last=t;let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),l=Math.hypot(dx,dy)||1;mv(pl,dx/l*pl.speed*dt,dy/l*pl.speed*dt);for(const e of O.filter(o=>o.behavior==='chase')){let vx=pl.x-e.x,vy=pl.y-e.y,z=Math.hypot(vx,vy)||1;mv(e,vx/z*e.speed*dt,vy/z*e.speed*dt)}for(const q of O.filter(o=>o.behavior==='coin'&&!o.collected))if(hit(pl,q)){q.collected=1;got++}h.textContent='Coins: '+got+'/'+total;x.fillStyle=P.background;x.fillRect(0,0,W,H);for(const o of O){if(o.behavior==='spawn'||o.collected)continue;x.save();x.translate(o.x+o.w/2,o.y+o.h/2);x.rotate((o.rotation||0)*Math.PI/180);x.fillStyle=o.color;if(['player','enemy','coin'].includes(o.type)){x.beginPath();x.ellipse(0,0,o.w/2,o.h/2,0,0,7);x.fill()}else if(o.type==='text'){x.font='20px system-ui';x.textAlign='center';x.fillText(o.text||o.name,0,5)}else x.fillRect(-o.w/2,-o.h/2,o.w,o.h);x.restore()}if(total&&got>=total){x.fillStyle='#000a';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='bold 42px system-ui';x.fillText('YOU WIN!',W/2,H/2)}requestAnimationFrame(L)}requestAnimationFrame(L);<\/script></body></html>`}
$('export').onclick=()=>download((p.name||'Game').replace(/\W+/g,'-')+'.html',exported(),'text/html');
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('projectName').onchange=render;$('bg').onchange=render;
add('player');add('wall');add('coin');add('coin');add('coin');hist=[];buttons();render();
</script></body></html>
